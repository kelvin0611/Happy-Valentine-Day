<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Varela Round', sans-serif;
            background-color: #fdf2f8; /* Light pink background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            text-align: center;
        }

        /* Language Toggle Button */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: white;
            border: 2px solid #db2777;
            color: #db2777;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .lang-switch:hover {
            background-color: #db2777;
            color: white;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px; 
        }

        .gif-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .gif-container img {
            max-width: 200px;
            max-height: 200px;
            height: auto;
            border-radius: 15px;
            transition: all 0.3s ease;
            /* Add min dimensions to prevent layout shift during loading */
            min-height: 150px; 
            min-width: 150px;
            object-fit: contain;
        }

        h1 {
            color: #be185d;
            font-size: 2rem;
            margin-bottom: 30px;
            padding: 0 20px;
            line-height: 1.5;
            min-height: 96px; 
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            width: 100%;
            height: 100px; 
        }

        button {
            font-family: 'Varela Round', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #db2777;
            color: white;
            padding: 12px 32px;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(219, 39, 119, 0.3);
            z-index: 100; /* Always on top */
            position: relative; 
        }

        #yesBtn:hover {
            background-color: #be185d;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #e5e7eb;
            color: #374151;
            padding: 12px 32px;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 50; 
            position: relative; 
        }

        #noBtn:hover {
            background-color: #d1d5db;
        }

        .success-message {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        
        .success-message h1 {
            font-size: 2.5rem;
            color: #db2777;
        }
    </style>
</head>
<body>

    <!-- Language Switch Button -->
    <button class="lang-switch" id="langBtn" onclick="toggleLanguage()">EN / 中文</button>

    <!-- Question Screen -->
    <div class="container" id="questionContainer">
        <div class="gif-container">
            <!-- Initial Image (Specific Line Dog GIF) -->
            <img id="mainImage" src="https://s1.aigei.com/src/img/gif/7f/7fa165ee91f24684a45b4551ca48cf34.gif?e=2051020800&token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:VWN66uTYKDmRTU6-yMrHvElMkmM=" alt="Cute Line Dog">
        </div>
        <h1 id="questionText">情人節快樂！<br>你對今年的禮物滿意嗎？</h1>
        
        <div class="buttons">
            <button id="yesBtn">滿意 (Yes)</button>
            <button id="noBtn">不滿意 (No)</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div class="success-message" id="successContainer">
        <div class="gif-container">
            <!-- Success Image (Kissing Line Dogs) -->
            <img src="https://media.tenor.com/P5BB0cvFWzsAAAAM/line-dog.gif" alt="Line Dog Kiss">
        </div>
        <h1 id="successText">太好了！我也愛你！💖</h1>
    </div>

    <script>
        // DOM Elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionContainer = document.getElementById('questionContainer');
        const successContainer = document.getElementById('successContainer');
        const mainImage = document.getElementById('mainImage');
        const questionText = document.getElementById('questionText');
        const successText = document.getElementById('successText');
        const langBtn = document.getElementById('langBtn');

        // State
        let currentLang = 'zh'; // Default language
        let messageIndex = 0;   // Track which "No" message we are on

        // Text Content
        const content = {
            zh: {
                question: "情人節快樂！<br>你對今年的禮物滿意嗎？",
                yesBtn: "滿意 (Yes)",
                noBtnDefault: "不滿意 (No)",
                success: "太好了！我也愛你！💖",
                messages: [
                    "不滿意 (No)",
                    "你確定嗎？",
                    "真的不喜歡？",
                    "再看一眼啦！",
                    "這是我挑很久的耶 😢",
                    "我會很傷心...",
                    "我會超級超級傷心...",
                    "我會難過到哭出來...",
                    "好啦我不問了...",
                    "開玩笑的，選 Yes 啦！"
                ]
            },
            en: {
                question: "Happy Valentine's Day!<br>Do you like your gift this year?",
                yesBtn: "Yes",
                noBtnDefault: "No",
                success: "Yay! I love you too! 💖",
                messages: [
                    "No",
                    "Are you sure?",
                    "Really sure?",
                    "Think again!",
                    "I spent ages picking this! 😢",
                    "I will be very sad...",
                    "I will be super super sad...",
                    "I'm gonna cry...",
                    "Fine, I'll stop asking...",
                    "Just kidding, say Yes!"
                ]
            }
        };

        // Sad/Funny images for "No" clicks (Updated list)
        const sadImages = [
            "https://media.tenor.com/FZxj4M9HGSwAAAAM/jinsoulery-jinsoulburger.gif", // Crying
            "https://i.chzbgr.com/full/5156853504/h15E719DA/goggie-gif-like-a-polaroid-picture", // Side eye
            "https://media.tenor.com/j1_q_Jk4sZUAAAAi/dog-cry.gif",  // Bawling
            "https://media.tenor.com/STjTuyHNVmwAAAAM/dog-crying-meme-doggo-crys.gif", // Innocent eyes
            "https://media.tenor.com/yc_qNawzNVAAAAAM/shocked-dog.gif"   // Shocked
        ];

        // --- PRELOAD IMAGES FUNCTION ---
        // This forces the browser to download all images in the background as soon as the page loads.
        function preloadImages() {
            for (let i = 0; i < sadImages.length; i++) {
                const img = new Image();
                img.src = sadImages[i];
            }
        }
        // Call the function immediately
        preloadImages();


        // Language Toggle Function
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateText();
        }

        function updateText() {
            const c = content[currentLang];
            questionText.innerHTML = c.question;
            yesBtn.innerText = c.yesBtn;
            successText.innerText = c.success;
            
            // If the user hasn't clicked No yet (or just started), reset/update the No button text
            // If they are deep in the loop, we try to map the current index to the new language
            noBtn.innerText = c.messages[messageIndex % c.messages.length];
        }

        // --- Interaction Logic ---

        noBtn.addEventListener('click', () => {
            // 1. Advance text index
            messageIndex = (messageIndex + 1) % content[currentLang].messages.length;
            noBtn.innerText = content[currentLang].messages[messageIndex];

            // 2. Change Image
            const randomImageIndex = Math.floor(Math.random() * sadImages.length);
            mainImage.src = sadImages[randomImageIndex];

            // 3. Make Yes Button Bigger
            const currentFontSize = window.getComputedStyle(yesBtn).fontSize;
            const newFontSize = parseFloat(currentFontSize) * 1.4; 
            yesBtn.style.fontSize = `${newFontSize}px`;
            
            // Adjust padding to keep proportions
            const currentPadding = parseFloat(window.getComputedStyle(yesBtn).paddingTop);
            yesBtn.style.padding = `${currentPadding * 1.2}px ${currentPadding * 2.5}px`;

            // 4. Move No Button Randomly
            moveNoButton();
        });

        function moveNoButton() {
            noBtn.style.position = 'fixed'; // Use fixed to allow full screen movement
            
            const maxWidth = window.innerWidth - noBtn.offsetWidth;
            const maxHeight = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.random() * maxWidth;
            const randomY = Math.random() * maxHeight;

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            
            // Keep Z-index lower than Yes button so it can be covered
            noBtn.style.zIndex = '50'; 
        }

        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            successContainer.style.display = 'flex'; 
        });
    </script>
</body>
</html>
